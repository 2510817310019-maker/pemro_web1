<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JPhotography - Nama_NIM</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Montserrat:wght@400;500&display=swap" rel="stylesheet">

    <style>
        /* Kustomisasi CSS Utama */
        body {
            font-family: 'Montserrat', sans-serif;
            color: #333;
        }
        .serif-font {
            font-family: 'Playfair Display', serif;
        }
        
        .container-custom {
            position: relative;
            max-width: 900px;
            margin: 40px auto;
            padding: 40px 20px;
        }
        
        .corner-tl { position: absolute; top: 0; left: 15px; width: 40px; height: 40px; border-top: 6px solid #222; border-left: 6px solid #222; }
        .corner-tr { position: absolute; top: 0; right: 15px; width: 40px; height: 40px; border-top: 6px solid #222; border-right: 6px solid #222; }
        .corner-bl { position: absolute; bottom: 0; left: 15px; width: 40px; height: 40px; border-bottom: 6px solid #222; border-left: 6px solid #222; }
        .corner-br { position: absolute; bottom: 0; right: 15px; width: 40px; height: 40px; border-bottom: 6px solid #222; border-right: 6px solid #222; }

        .nav-link {
            color: #999;
            font-size: 0.7rem;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            padding: 5px 15px !important;
            margin: 0 5px;
        }
        .nav-link.active {
            border: 1px solid #ccc;
            border-radius: 20px;
            color: #333 !important;
            font-weight: 500;
        }

        .subheading {
            font-size: 0.65rem;
            letter-spacing: 3px;
            color: #aaa;
            text-transform: uppercase;
        }

        .filter-btn {
            font-size: 0.75rem;
            color: #888;
            text-transform: capitalize;
            text-decoration: none;
            padding: 3px 15px;
        }
        .filter-btn.active {
            border: 1px solid #ccc;
            border-radius: 20px;
            color: #333;
        }

         .gallery-item {
            width: 100%;
            height: 200px; 
            object-fit: cover;
            object-position:70% 28%; 
            transition: 0.3s ease;
}
        .gallery-item:hover {
            filter: grayscale(0%);
        }

        .social-icons i {
            font-size: 0.8rem;
            color: #999;
            margin: 0 5px;
            cursor: pointer;
        }
        .social-icons i:hover { color: #333; }
        .footer-logo { font-size: 1rem; margin-bottom: 5px;}
        .copyright { font-size: 0.6rem; color: #aaa; }
    </style>
</head>
<body>

    <div class="container container-custom">

</body>
